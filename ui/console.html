<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cursor · Magpie Bridge 控制台</title>
<style>
  :root { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: var(--magpie-bg, #f6f6f7); color: var(--magpie-fg, #1c1c1e); font: 13px/1.5 var(--magpie-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif); }
  main { max-width: 620px; margin: 0 auto; padding: 36px 24px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .hint { margin: 0; font-size: 12.5px; color: var(--magpie-muted, #6b7280); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--magpie-muted, #6b7280); }
  input { width: 82px; font: 12.5px var(--magpie-code, ui-monospace, Menlo, monospace); color: var(--magpie-fg, #1c1c1e); background: var(--magpie-card, #fff); border: 1px solid var(--magpie-line, #e5e7eb); border-radius: 6px; padding: 4px 8px; }
  button { font: inherit; color: inherit; background: var(--magpie-card, #fff); border: 1px solid var(--magpie-line, #e5e7eb); border-radius: 7px; padding: 4px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--magpie-muted, #6b7280); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--magpie-accent, #4f46e5); border-color: transparent; color: #fff; }
  .tip { margin: 0; font-size: 11.5px; color: var(--magpie-muted, #6b7280); }
  :focus-visible { outline: 2px solid var(--magpie-accent, #4f46e5); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <h1>Cursor · Magpie Bridge 控制台</h1>
  <p class="hint" id="hint">正在打开本机控制台…</p>
  <div class="row">
    <label>控制端口 <input id="port" type="number" min="1024" max="65535" step="1" inputmode="numeric"></label>
    <button id="save" type="button">保存端口</button>
    <button id="open" class="primary" type="button">打开控制台</button>
  </div>
  <p class="tip" id="tip">控制台提供启动 / 状态 / 重启；只监听本机 127.0.0.1。</p>
</main>
<script src="_magpie/bridge.js"></script>
<script src="console-page.js"></script>
</body>
</html>
